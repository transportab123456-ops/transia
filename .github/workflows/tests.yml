name: Tests

# Chaque push (toutes branches) et chaque pull request.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # npm test monte une base PostgreSQL jetable dans Docker,
      # préinstallé sur les runners ubuntu-latest.
      - run: npm test
